            background: linear-gradient(-45deg, #000000, #0a1a0a, #000000, #0a1a0a);

            color: white; text-decoration: none; border-radius: 12px; 
            transition: all 0.3s ease; backdrop-filter: blur(10px);
        }
        .button:hover { 
            background: #33ff33; color: #000; font-weight: bold;
            transform: translateY(-5px); box-shadow: 0 10px 20px rgba(51, 255, 51, 0.5);
